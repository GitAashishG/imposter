<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3eb" />
    <script>
      (() => {
        let preference = "system";
        try {
          const saved = localStorage.getItem("ko-ho-theme");
          if (saved === "light" || saved === "dark") preference = saved;
        } catch {
          // Follow the device when browser storage is unavailable.
        }
        const theme =
          preference === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#131d19" : "#f6f3eb");
      })();
    </script>
    <meta
      name="description"
      content="One phone. Your people. One imposter. A bilingual Nepali-American party game made for your next get-together."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ko Ho?" />
    <title>Ko Ho? — Someone's bluffing.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
